services:
  ufa-php:
    container_name: ufa_php
    build: .
    volumes:
      - .:/var/www
    ports:
      - "30510:8000"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  database:
    container_name: ufa_db
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db_data:
